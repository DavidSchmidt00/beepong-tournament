<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Beer Pong</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="glass-panel login-container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="justify-content: center; margin-bottom: 0.5rem;">🍺 Beer Pong</h1>
      <p style="color: var(--text-muted); margin: 0;">Admin-Login</p>
    </div>
    
    {% if error %}
    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger); padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem;">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="post" action="/login">
      <div style="margin-bottom: 1.5rem;">
        <label>Passwort</label>
        <input type="password" name="password" placeholder="Admin-Passwort eingeben" required autofocus>
      </div>
      <button type="submit" class="btn w-full">Einloggen</button>
    </form>
  </div>
</body>
</html>
